logical_dataset: commodity_daily
contract_version: 1
description: Domestic and international commodity daily observations.
primary_key_fields:
  - provider_id
  - exchange
  - contract
  - trading_date
required_fields:
  - provider_id
  - source_id
  - exchange
  - contract
  - trading_date
  - first_seen_at
  - raw_uri
  - content_hash
optional_fields:
  - symbol
  - open
  - high
  - low
  - close
  - settlement
  - prev_settlement
  - volume
  - open_interest
  - session
  - quality_status
quality_rules:
  hard:
    - first_seen_at_not_null
    - raw_uri_exists
    - content_hash_not_null
    - contract_not_null
  soft:
    - settlement_non_negative
    - volume_non_negative

