logical_dataset: trading_calendar
contract_version: 1
description: Trading calendar for China A-share market.
primary_key_fields:
  - provider_id
  - calendar_id
  - trading_date
required_fields:
  - provider_id
  - source_id
  - calendar_id
  - trading_date
  - is_trading_day
  - first_seen_at
  - raw_uri
  - content_hash
optional_fields:
  - exchange
  - session_type
  - holiday_name
  - quality_status
quality_rules:
  hard:
    - first_seen_at_not_null
    - raw_uri_exists
    - content_hash_not_null
    - trading_date_not_null
  soft:
    - calendar_matches_recent_exchange_notice

