logical_dataset: industry_membership
contract_version: 1
description: Point-in-time industry board membership snapshots.
primary_key_fields:
  - provider_id
  - industry_name
  - instrument
  - snapshot_date
required_fields:
  - provider_id
  - source_id
  - industry_name
  - instrument
  - exchange
  - snapshot_date
  - metric_payload
  - first_seen_at
  - raw_uri
  - content_hash
optional_fields:
  - source_timestamp
  - quality_status
quality_rules:
  hard:
    - first_seen_at_not_null
    - raw_uri_exists
    - content_hash_not_null
    - instrument_format_valid
    - snapshot_date_not_null
    - metric_payload_not_empty
  soft:
    - membership_count_near_recent_median
