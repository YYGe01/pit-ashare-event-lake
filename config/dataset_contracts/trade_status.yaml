logical_dataset: trade_status
contract_version: 1
description: A-share halt, resume, and trading status observations.
primary_key_fields:
  - provider_id
  - instrument
  - trading_date
required_fields:
  - provider_id
  - source_id
  - instrument
  - exchange
  - trading_date
  - trade_status
  - first_seen_at
  - raw_uri
  - content_hash
optional_fields:
  - halt_reason
  - source_publish_time
  - source_update_time
  - quality_status
quality_rules:
  hard:
    - first_seen_at_not_null
    - raw_uri_exists
    - content_hash_not_null
    - trade_status_not_null
  soft:
    - status_domain_valid

