timezone: Asia/Shanghai
default_calendar: cn_ashare

policies:
  - logical_dataset: financial_indicator
    priority: P1
    cadence: quarterly_disclosure_daily_fallback
    windows:
      - "20:30"
      - "next_trading_day 08:30"
    freshness_slo_minutes: 2880
    notes: "P1 financial indicator bootstrap; run daily during disclosure season and lower cadence otherwise."

  - logical_dataset: macro_indicator
    priority: P1
    cadence: monthly_release_daily_fallback
    windows:
      - "10:30"
      - "20:30"
    freshness_slo_minutes: 4320
    notes: "P1 macro bootstrap; preserve provider metric_payload and reconcile release timestamp later."

  - logical_dataset: capital_flow
    priority: P1
    cadence: daily
    windows:
      - "20:30"
    freshness_slo_minutes: 2880
    notes: "P1 stock-level fund flow, margin trading, and Dragon Tiger List bootstrap; keep sample scope small until source stability is observed."

  - logical_dataset: fund_holding
    priority: P1
    cadence: quarterly_disclosure_weekly_fallback
    windows:
      - "21:30"
    freshness_slo_minutes: 10080
    notes: "P1 public fund holding bootstrap; treat provider rows as observed snapshots until official filings are reconciled."

  - logical_dataset: financial_news
    priority: P1
    cadence: daily_or_six_hour_summary
    windows:
      - "08:45"
      - "14:45"
      - "20:45"
    freshness_slo_minutes: 720
    notes: "P1 financial news metadata bootstrap; no event extraction or sentiment scoring in collection layer."

  - logical_dataset: public_sentiment
    priority: P1
    cadence: daily_or_six_hour_summary
    windows:
      - "09:00"
      - "15:30"
      - "21:00"
    freshness_slo_minutes: 720
    notes: "P1 public attention proxy bootstrap; rank/heat fields remain provider payload, not normalized sentiment labels."

  - logical_dataset: industry_membership
    priority: P1
    cadence: daily
    windows:
      - "20:45"
    freshness_slo_minutes: 4320
    notes: "P1 industry board membership snapshot bootstrap."

  - logical_dataset: concept_membership
    priority: P1
    cadence: daily
    windows:
      - "21:00"
    freshness_slo_minutes: 4320
    notes: "P1 concept board membership snapshot bootstrap."

  - logical_dataset: global_event_summary
    priority: P1
    cadence: six_hour_or_daily_summary
    windows:
      - "08:30"
      - "14:30"
      - "20:30"
    freshness_slo_minutes: 720
    notes: "P1 GDELT/global event metadata summary; collect metadata only before event extraction exists."

  - logical_dataset: weather_daily
    priority: P1
    cadence: daily
    windows:
      - "09:30"
    freshness_slo_minutes: 2880
    notes: "P1 weather bootstrap; keep geographic observations separate from downstream impact mapping."

  - logical_dataset: market_daily_ohlcv
    priority: P0
    cadence: daily
    windows:
      - "16:30"
      - "20:00"
      - "next_trading_day 08:30"
    freshness_slo_minutes: 960
    notes: "盘后第一次采集、晚间校验、次日开盘前兜底。"

  - logical_dataset: adjustment_factor
    priority: P0
    cadence: daily
    windows:
      - "20:00"
      - "next_trading_day 08:30"
    freshness_slo_minutes: 960
    notes: "复权因子与日线分开采集和发布。"

  - logical_dataset: trading_calendar
    priority: P0
    cadence: daily
    windows:
      - "08:00"
      - "16:30"
    freshness_slo_minutes: 1440
    notes: "盘前确认交易日，盘后确认实际状态。"

  - logical_dataset: trade_status
    priority: P0
    cadence: daily
    windows:
      - "08:30"
      - "16:30"
    freshness_slo_minutes: 1440
    notes: "停复牌和交易状态。"

  - logical_dataset: price_limit
    priority: P0
    cadence: daily
    windows:
      - "08:30"
      - "16:30"
    freshness_slo_minutes: 1440
    notes: "涨跌停价格。"

  - logical_dataset: announcement_index
    priority: P0
    cadence: trading_day_interval
    interval: "1-2h"
    windows:
      - "09:00-23:30 every 2h"
      - "20:00"
      - "23:00"
    freshness_slo_minutes: 180
    notes: "保存列表页、详情页、PDF 和附件；不绕过登录或验证码。"

  - logical_dataset: policy_regulatory_doc
    priority: P0
    cadence: daily
    windows:
      - "10:30"
      - "15:30"
      - "20:30"
    freshness_slo_minutes: 720
    notes: "政策监管页面和附件低频轮询。"

  - logical_dataset: commodity_daily
    priority: P0
    cadence: daily
    windows:
      - "16:30"
      - "21:30"
      - "next_day 08:30"
    freshness_slo_minutes: 1440
    notes: "国内期货日盘/夜盘/结算价口径后续在 connector 内明确。"

  - logical_dataset: global_market_daily
    priority: P0
    cadence: daily
    windows:
      - "07:30"
      - "09:00"
    freshness_slo_minutes: 1440
    notes: "海外收盘后和 A 股开盘前兜底。"
