logical_dataset: market_tick_trade
contract_version: 1
description: Planned licensed tick or trade-by-trade observations; disabled until entitlement and high-volume storage are confirmed.
primary_key_fields:
  - provider_id
  - venue
  - instrument
  - trade_time
  - trade_sequence
required_fields:
  - provider_id
  - source_id
  - venue
  - instrument
  - exchange
  - trade_time
  - trade_sequence
  - price
  - volume
  - storage_permission
  - license_ref
  - first_seen_at
  - raw_uri
  - content_hash
optional_fields:
  - source_item_key
  - side
  - amount
  - quality_status
quality_rules:
  hard:
    - entitlement_confirmed
    - first_seen_at_not_null
    - raw_uri_exists
    - content_hash_not_null
  soft:
    - price_non_negative
    - volume_non_negative
