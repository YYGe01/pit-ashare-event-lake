logical_dataset: social_media_aggregate
contract_version: 1
description: Public social, comment, or attention aggregate snapshots; no private user content or raw post body is required.
primary_key_fields:
  - provider_id
  - sentiment_scope
  - instrument
  - snapshot_date
required_fields:
  - provider_id
  - source_id
  - sentiment_scope
  - instrument
  - exchange
  - snapshot_date
  - metric_payload
  - first_seen_at
  - raw_uri
  - content_hash
optional_fields:
  - source_item_key
  - platform
  - rank
  - source_timestamp
  - quality_status
quality_rules:
  hard:
    - first_seen_at_not_null
    - raw_uri_exists
    - content_hash_not_null
    - metric_payload_not_empty
  soft:
    - snapshot_date_not_null
    - row_count_near_recent_median
