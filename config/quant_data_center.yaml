project:
  name: quant_data_center
  timezone: Asia/Shanghai
  phase: migration_phase_2

paths:
  data_root: data/quant_data_center
  database_path: data/quant_data_center/qdc.duckdb
  raw_root: data/quant_data_center/raw
  parquet_root: data/quant_data_center/parquet
  qlib_root: data/quant_data_center/qlib
  logs_dir: data/quant_data_center/logs

qlib_provider:
  provider_uri: ~/.qlib/qlib_data/cn_data
  required_fields:
    - $close
    - $volume
    - $factor

runtime:
  database_backend: duckdb
  file_format: parquet
  use_environment_proxy: false

policy:
  prefer_free_sources: true
  paid_providers_enabled: false
  raw_append_only: true
  unknown_copyright_policy: metadata_only

daily_pipeline:
  date: null
  date_offset_days: -1
  universe: all_a
  source_id: akshare
  source_ids:
    - akshare
    - eastmoney
    - sina
  symbols: null
  all_market: null
  skip_stock_basic_refresh: false
  batch_size: 50
  limit_tasks: null
  daily_parallelism: 1
  provider_uri: null
  export_start: null
  market_name: null
  plan_only: false
  control_only: false
  watch: false
  continue_on_failure: false
  crawl_documents: true
  crawl_source_id: null
  crawl_limit_tasks: null
  crawl_page_size: null
  crawl_max_pages: null
  crawl_pdf_limit: null
  crawl_parallelism: null
  crawl_request_timeout_seconds: null
  crawl_source_timeout_seconds: null
  crawl_instrument_parallelism: null
  crawl_instrument_limit: null
  crawl_interaction_schedule: null
  crawl_interaction_cold_no_data_days: null
  crawl_interaction_cold_check_interval_days: null
  crawl_interaction_cold_lookback_days: null
  crawl_interaction_unsupported_check_interval_days: null
  skip_crawl_pdf_download: null
  skip_factors: false
  skip_sync: false
  skip_quality: false
  skip_export: false

crawl_daily:
  date: null
  source_id: null
  symbols: null
  limit_tasks: null
  page_size: 30
  max_pages: null
  pdf_limit: null
  parallel_sources: 1
  request_timeout_seconds: 30
  source_timeout_seconds: 900
  instrument_parallelism: 8
  instrument_limit: 0
  interaction_schedule: cold-weekly
  interaction_cold_no_data_days: 14
  interaction_cold_check_interval_days: 7
  interaction_cold_lookback_days: 14
  interaction_unsupported_check_interval_days: 30
  skip_pdf_download: true
  watch: false
  plan_only: false
  control_only: false
  source_overrides:
    sse_announcement:
      page_size: 500
      request_timeout_seconds: 120
      source_timeout_seconds: 900
    cninfo_investor_interaction:
      source_timeout_seconds: 7200

llm:
  text_event:
    provider: rule
    model: deepseek/deepseek-v4-flash
    api_key_file: data/quant_data_center/secrets/deepseek_api_key
    api_key_env: DEEPSEEK_API_KEY
    temperature: 0
    max_tokens: 512

universes:
  csi300:
    description: "Migration-phase CSI300 sample universe; replace with full constituent snapshots later."
    symbols:
      - SH600000
      - SZ000001
      - SZ300750
