logical_dataset: global_market_daily
contract_version: 1
description: Global daily risk and market indicators.
primary_key_fields:
  - provider_id
  - symbol
  - trading_date
required_fields:
  - provider_id
  - source_id
  - symbol
  - trading_date
  - first_seen_at
  - raw_uri
  - content_hash
optional_fields:
  - market
  - name
  - open
  - high
  - low
  - close
  - currency
  - timezone
  - source_timestamp
  - quality_status
quality_rules:
  hard:
    - first_seen_at_not_null
    - raw_uri_exists
    - content_hash_not_null
    - symbol_not_null
  soft:
    - close_non_negative_if_present
    - timezone_present_for_non_cn_market

