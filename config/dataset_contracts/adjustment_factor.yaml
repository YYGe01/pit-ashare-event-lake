logical_dataset: adjustment_factor
contract_version: 1
description: A-share daily adjustment factor observations.
primary_key_fields:
  - provider_id
  - instrument
  - trading_date
required_fields:
  - provider_id
  - source_id
  - instrument
  - exchange
  - trading_date
  - adj_factor
  - first_seen_at
  - raw_uri
  - content_hash
optional_fields:
  - source_timestamp
  - factor_type
  - quality_status
quality_rules:
  hard:
    - first_seen_at_not_null
    - raw_uri_exists
    - content_hash_not_null
    - adj_factor_not_null
  soft:
    - factor_change_reasonable

