logical_dataset: announcement_index
contract_version: 1
description: Listed company announcement index and raw document pointers.
primary_key_fields:
  - provider_id
  - source_item_key
required_fields:
  - provider_id
  - source_id
  - source_item_key
  - title
  - source_url
  - first_seen_at
  - raw_uri
  - content_hash
optional_fields:
  - announcement_id
  - instrument
  - exchange
  - security_name
  - category
  - source_publish_time
  - source_update_time
  - pdf_url
  - attachment_urls
  - quality_status
quality_rules:
  hard:
    - first_seen_at_not_null
    - raw_uri_exists
    - content_hash_not_null
    - title_not_empty
    - source_url_not_empty
  soft:
    - source_publish_time_not_in_future_over_10m
    - pdf_size_greater_than_1kb_if_attachment
    - instrument_format_valid_if_present

