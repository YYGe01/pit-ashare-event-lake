logical_dataset: professional_event_feed
contract_version: 1
description: Planned paid professional structured event feed for vendor-vs-internal event reconciliation.
primary_key_fields:
  - provider_id
  - event_key
required_fields:
  - provider_id
  - source_id
  - event_key
  - event_time
  - event_type
  - source_url
  - storage_permission
  - license_ref
  - metric_payload
  - first_seen_at
  - raw_uri
  - content_hash
optional_fields:
  - source_item_key
  - instrument
  - exchange
  - entity_payload
  - quality_status
quality_rules:
  hard:
    - entitlement_confirmed
    - first_seen_at_not_null
    - raw_uri_exists
    - content_hash_not_null
  soft:
    - event_time_not_in_future_over_10m
