logical_dataset: system_smoke_test
contract_version: 1
description: Internal no-network smoke test dataset.
primary_key_fields:
  - provider_id
  - source_item_key
required_fields:
  - provider_id
  - source_id
  - source_item_key
  - first_seen_at
  - raw_uri
  - content_hash
optional_fields:
  - message
quality_rules:
  hard:
    - first_seen_at_not_null
    - raw_uri_exists
    - content_hash_not_null

