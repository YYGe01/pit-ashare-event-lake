logical_dataset: supply_chain_relationship
contract_version: 1
description: Planned licensed customer, supplier, and supply-chain relationship snapshots.
primary_key_fields:
  - provider_id
  - relationship_key
  - snapshot_date
required_fields:
  - provider_id
  - source_id
  - relationship_key
  - upstream_entity
  - downstream_entity
  - relationship_type
  - snapshot_date
  - storage_permission
  - license_ref
  - metric_payload
  - first_seen_at
  - raw_uri
  - content_hash
optional_fields:
  - source_item_key
  - confidence
  - quality_status
quality_rules:
  hard:
    - entitlement_confirmed
    - first_seen_at_not_null
    - raw_uri_exists
    - content_hash_not_null
  soft:
    - snapshot_date_not_null
