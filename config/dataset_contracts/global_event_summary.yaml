logical_dataset: global_event_summary
contract_version: 1
description: Low-frequency public global news/event summary metadata.
primary_key_fields:
  - provider_id
  - event_key
  - snapshot_date
required_fields:
  - provider_id
  - source_id
  - event_key
  - snapshot_date
  - metric_payload
  - first_seen_at
  - raw_uri
  - content_hash
optional_fields:
  - query
  - source_timestamp
  - quality_status
quality_rules:
  hard:
    - first_seen_at_not_null
    - raw_uri_exists
    - content_hash_not_null
    - event_key_not_null
    - snapshot_date_not_null
    - metric_payload_not_empty
  soft:
    - row_count_near_recent_median
