logical_dataset: capital_flow
contract_version: 1
description: Capital flow observations such as stock-level fund flow snapshots.
primary_key_fields:
  - provider_id
  - instrument
  - trading_date
required_fields:
  - provider_id
  - source_id
  - instrument
  - exchange
  - trading_date
  - metric_payload
  - first_seen_at
  - raw_uri
  - content_hash
optional_fields:
  - flow_scope
  - source_timestamp
  - quality_status
quality_rules:
  hard:
    - first_seen_at_not_null
    - raw_uri_exists
    - content_hash_not_null
    - instrument_format_valid
    - trading_date_not_null
    - metric_payload_not_empty
  soft:
    - row_count_near_recent_median
