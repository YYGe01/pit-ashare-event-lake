qlib_init:
    provider_uri: data/quant_data_center/qlib/cn_data
    region: cn
market: &market qdc_smoke
data_handler_config: &data_handler_config
    start_time: 2023-01-01
    end_time: 2024-12-31
    fit_start_time: 2023-01-01
    fit_end_time: 2023-12-31
    instruments: *market
    external_fields:
        - news_count
        - news_sentiment_mean
        - news_positive_count
        - news_negative_count
        - news_growth_count
        - news_risk_count
        - news_financing_count
        - announcement_count
        - announcement_risk_count
        - announcement_financing_count
        - announcement_operation_count
    external_windows: [0, 3, 5]
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.05
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 6
            num_leaves: 64
            num_threads: 2
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: QdcAlpha158WithExternal
                module_path: quant_data_center.qlib_ext.handlers
                kwargs: *data_handler_config
            segments:
                train: [2023-01-01, 2023-12-31]
                valid: [2024-01-01, 2024-06-30]
                test: [2024-07-01, 2024-12-31]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              model: <MODEL>
              dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              ana_long_short: False
              ann_scaler: 252
